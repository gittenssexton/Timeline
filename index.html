 if(wisps?.complete&&wisps.naturalWidth){
  ctx.save();ctx.imageSmoothingEnabled=false;ctx.globalAlpha=.55;
  const wx=(((390-(p-min)*.011+sceneryClock*.3)%600)+600)%600-230;
  ctx.drawImage(wisps,0,0,240,64,Math.round(wx),27,150,34);
  ctx.restore();
 }
 // Small independent bird silhouettes, subtle animation and no hit boxes.
 const birdsX=(((390-(p-min)*.021+sceneryClock*2.6)%480)+480)%480-75;
 for(let i=0;i<4;i++){
  const x=Math.round(birdsX+i*11),y=21+i%2*4+Math.round(Math.sin(sceneryClock*.12+i)*2);
  block(x,y,2,1,'#455866');block(x+3,y+1,2,1,'#455866');
 }
}
function drawLandscape(){
 const travel=p-min;
 // Sky stays behind all separate alpha PNG assets.
 block(0,0,320,180,'#b5d2cb');
 block(0,0,320,39,'#9dc7ce');
 block(0,39,320,44,'#c4d6c3');
 block(258,27,14,14,'#f4d39a');
 drawClouds();
 // Far layers move slowly. Near layers travel faster.
 tileAsset('mountains',travel*.028,560,47,121,.88);
 tileAsset('valley',travel*.065,535,65,128,1);
 tileAsset('forest',travel*.12+110,480,85,147,.90);
 // Prominent settlements move as discrete landmarks, not repeating every few steps.
 // Each pass through the demo timeline repeats these at their original coordinates.
 // Mature Harappan urban districts recur geographically within this long test scene.
 for(const townAt of [-3800,-2850,-1370]){
  const urbanX=150+(townAt-p)*.18;
  if(urbanX>-350&&urbanX<690)drawAsset('city',urbanX-185,61,415,98,1);
 }
 const ruinX=150+(1130-p)*.18;
 if(ruinX>-350&&ruinX<690)drawAsset('ruins',ruinX-185,72,407,92,1);
 // Continuous surface of the road. The world scrolls, the sprite remains centered.
 block(0,141,320,39,'#8b7052');
 block(0,141,320,3,'#c0a37b');
 block(0,144,320,3,'#a68760');
 for(let k=0;k<12;k++){
  let x=((k*43-travel*.51)%420+420)%420-40;
  block(x,150+(k%3)*8,6,2,'#a48866');
  block(x+12,163+(k%2)*5,3,2,'#6d644e');
 }
}
// Draw low plants after the player, without covering the player's face.
function drawForeground(){
 tileAsset('reeds',(p-min)*.3+175,450,135,83,.66);
}

function draw(){
 drawLandscape();
 for(const e of activeEvents()){
 let x=eventScreenX(e);if(x<-30||x>350)continue;
 if(e.type==='person'){
  if(Number.isInteger(e.spriteIndex)&&npcSprites.complete&&npcSprites.naturalWidth>=640){
   ctx.drawImage(npcSprites,e.spriteIndex*64,0,64,64,Math.round(x)-32,82,64,64);
  } else person(x,e.id==='traveler'?'#82647a':e.id==='herder'?'#6f7556':'#976b4b');
 }
 else{block(x-15,136,30,6,'#907a60');block(x-5,132,15,4,'#a18c72');if(known.has(e.gain))block(x+5,125,4,5,'#5a5643')}
 const prev=promptAlpha.get(e.id)||0;
 const target=range(e)&&screen==='world'?1:0;
 const alpha=Math.max(0,Math.min(1,prev+(target?0.075:-0.095)));
 promptAlpha.set(e.id,alpha);
 if(alpha>0){
 ctx.save();ctx.globalAlpha=alpha;
 const promptY=Number.isInteger(e.spriteIndex)?75:87;
 block(x-12,promptY,24,16,'#363a3e');block(x-11,promptY+1,22,13,'#f4e9c6');
 block(x-2,promptY+14,5,4,'#363a3e');
 ctx.fillStyle='#292e32';ctx.font='bold 10px monospace';ctx.textAlign='center';
 ctx.fillText(e.type==='person'?'S':'↓',Math.round(x),promptY+11);
 ctx.restore();
 }
 }
 // Player sprite
 const x=150;
 const traveler=art.traveler;
 if(traveler?.complete&&traveler.naturalWidth){
  ctx.save();ctx.imageSmoothingEnabled=false;
  if(held.left&&!held.right){ctx.translate(300,0);ctx.scale(-1,1)}
  const walking=(held.left||held.right)&&screen==='world'&&jump===0;
  const bob=walking?Math.sin(sceneryClock*.36)*1.5:0;
  ctx.drawImage(traveler,138,96+jump+bob,24,53);
  ctx.restore();
 }else{
  block(144,108+jump,14,29,'#76583e');block(146,100+jump,10,10,'#b18a67');
 }
 drawForeground();
 drawDateRuler();
 // On-canvas 8-bit text window like a classic adventure game.
 if(screen==='encounter'){
  block(5,76,310,99,'#262c34');block(8,79,304,93,'#444d57');
  block(10,80,300,2,'#9ca7a0');block(10,169,300,2,'#242a32');
  ctx.fillStyle='#f8ebbf';ctx.font='bold 9px monospace';ctx.textAlign='left';
  const lines=[];
  for(const paragraph of sceneText.split('\n')){
   if(!paragraph.trim()){lines.push('');continue}
   let line='';
   for(const word of paragraph.split(/\s+/)){
    const next=line?line+' '+word:word;
    if(line&&ctx.measureText(next).width>282){lines.push(line);line=word}else line=next;
   }
   if(line)lines.push(line);
  }
  lines.slice(0,7).forEach((line,i)=>ctx.fillText(line,15,94+i*10));
  ctx.fillStyle='#dbd1aa';ctx.font='8px monospace';
  ctx.fillText('S / Q / Esc : continue',15,165);
 }

}
let previous=0;function frame(now){let dt=Math.min(2,(now-previous)/16.67||1);previous=now;
 sceneryClock+=dt;
 if(screen==='world'){
  if(held.left)p-=speed*dt;
  if(held.right)p+=speed*dt;
  if(p>length){p=min+(p-length);message('Demo loop: returning to the earlier Harappan landscape.')}
  if(p<min){p=length-(min-p);message('Demo loop: returning to the later landscape.')}
  if(held.up&&jump===0)vy=-4.1;
  jump+=vy*dt;vy+=.34*dt;
  if(jump>0){jump=0;vy=0}
 }
 renderPanel();draw();requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
</script></body></html>
