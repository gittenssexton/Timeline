<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><title>Kashgar Market — Walking & Blocking Test 019</title><style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#19232a;font-family:system-ui;color:#f3e5c6}
#game{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#scene{height:70%;flex:0 0 70%;position:relative;overflow:hidden;background:#91b4cc;isolation:isolate}
#market{position:absolute;height:100%;width:auto;max-width:none;left:0;top:0;pointer-events:none;image-rendering:auto;transform:translate3d(0,0,0)}
#traveler{position:absolute;z-index:7;height:23%;width:auto;bottom:14%;left:50%;transform:translateX(-50%);pointer-events:none;image-rendering:pixelated;filter:drop-shadow(1px 3px 1px #1a1515a0);display:block;object-fit:contain}

#deck{flex:1;min-height:0;background:#283a43;border-top:5px solid #b89a66;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
#note{font-size:clamp(12px,3.2vw,16px);text-align:center;line-height:1.3}
#pad{position:relative;width:min(26vh,26dvh,48vw,180px);height:min(26vh,26dvh,48vw,180px);min-width:104px;min-height:104px;border-radius:50%;background:radial-gradient(circle at 38% 27%,#657887,#263944 74%);border:6px solid #c2a678;box-shadow:inset 0 0 0 4px #15262e,0 4px 0 #15212a;touch-action:none;flex:none}
#pad:before{content:"";position:absolute;left:29%;right:29%;top:29%;bottom:29%;border-radius:50%;background:#aa9876;border:4px solid #152730;box-shadow:inset 0 2px 4px #f6d49a77}
.dir{position:absolute;border:0;background:transparent;color:#f4e5bb;font-weight:900;font-size:clamp(24px,7vw,38px);touch-action:none;cursor:pointer;display:grid;place-items:center;width:42%;height:66%;top:17%;border-radius:40%;-webkit-tap-highlight-color:transparent}
#left{left:0;top:30%;height:40%;width:39%}#right{right:0;top:30%;height:40%;width:39%}
#forward{left:30%;top:0;height:37%;width:40%;font-size:28px}
#backward{left:30%;bottom:0;top:auto;height:37%;width:40%;font-size:28px}
.dir.held{color:#ffe5a3;text-shadow:0 0 12px #f2bf60}
@media(orientation:landscape){#pad{width:min(25vh,110px);height:min(25vh,110px);min-width:80px;min-height:80px}.dir{font-size:23px}#deck{flex-direction:row}#traveler{height:32%;bottom:10%}}

const edgePoints=[
 [0,453],[140,452],[280,449],[420,448],
 [500,445],[600,443],[680,442],[760,442],
 [840,443],[930,449],[1010,452],[1110,453],
 [1210,451],[1320,450],[1420,453],[1536,456]

function minimumFootY(worldX){
 for(let i=1;i<edgePoints.length;i++){

}
const minimumDepth=worldX=>Math.max(0,Math.min(.94,(minimumFootY(worldX)-394.24)/87.04));
const canStand=(nextX,nextDepth)=>{
 const footX=nextX*1536;
 return nextX>=0.018&&nextX<=0.982&&nextDepth>=minimumDepth(footX)&&nextDepth<=0.94;
};
function redrawBoundaryOverlay(marketWidth,viewWidth){
 if(!showBoundaries)return;
 const height=scene.clientHeight;
 collisionOverlay.width=Math.max(1,Math.round(viewWidth));
 collisionOverlay.height=Math.max(1,Math.round(height));
 const ctx=collisionCtx;
 const scale=marketWidth/1536;
 ctx.fillStyle='rgba(57,234,131,.16)';
 ctx.strokeStyle='#83f5ad';ctx.lineWidth=2;
 ctx.beginPath();
 const startX=Math.max(0,Math.floor(camera/scale));
 const endX=Math.min(1536,Math.ceil((camera+viewWidth)/scale));
 const screenY=d=>height*(.77+.17*d);
 for(let bx=startX;bx<=endX;bx+=5){
  const u=bx*scale-camera;
  const d=minimumDepth(bx);
  if(bx===startX)ctx.moveTo(u,screenY(d));else ctx.lineTo(u,screenY(d));
 }
 ctx.lineTo(endX*scale-camera,screenY(.94));
 ctx.lineTo(startX*scale-camera,screenY(.94));ctx.closePath();ctx.fill();ctx.stroke();
}

const pressed={left:false,right:false,forward:false,backward:false};
function moveFrame(timestamp){
 const dt=Math.min(0.055,Math.max(0,(timestamp-previous)/1000)||0.016); previous=timestamp;
 const input=(pressed.right?1:0)-(pressed.left?1:0);
 const vertical=(pressed.backward?1:0)-(pressed.forward?1:0);
 const priorX=x,priorDepth=depth;
 const nextX=Math.max(0.018,Math.min(0.982,x+dt*0.26*input));
 const nextDepth=Math.max(0,Math.min(0.94,depth+dt*0.55*vertical));
 // Slide independently along each axis, rather than sticking on diagonal walls.
 // If a stall blocks forward travel, side movement can still work.
 if(input!==0){
  dir=input;
  // Follow the paved edge as you walk sideways rather than freezing
  // when its minimum depth rises by a few pixels.
  const safeDepth=Math.max(depth,minimumDepth(nextX*1536)+.001);
  if(canStand(nextX,safeDepth)){x=nextX;depth=safeDepth;}
 }
 if(vertical!==0&&canStand(x,nextDepth))depth=nextDepth;
 const walking=(Math.abs(x-priorX)>1e-7)||(Math.abs(depth-priorDepth)>1e-7);
 wasBlocked=(input!==0||vertical!==0)&&!walking;
 if(walking)gait+=dt*9;
 const srcIdx=(dir<0?4:0)+(walking?1+Math.floor(gait)%3:0);
 if(traveler.dataset.idx!==String(srcIdx)){traveler.src=sprites[srcIdx];traveler.dataset.idx=String(srcIdx);}
 const viewWidth=scene.clientWidth;
 // The market is an extra-wide photograph, shown at true scene height.
 const marketWidth=market.naturalWidth&&market.naturalHeight?scene.clientHeight*market.naturalWidth/market.naturalHeight:viewWidth*3;
 const travelWidth=Math.max(0,marketWidth-viewWidth);
 // Keep player centered, and use actual scene coordinates to move the panorama.
 const worldPx=x*marketWidth;
 const targetCamera=Math.max(0,Math.min(travelWidth,worldPx-viewWidth*0.5));
 camera=targetCamera;
 market.style.transform='translate3d('+(-camera)+'px,0,0)';
 const screenX=Math.max(26,Math.min(viewWidth-26,worldPx-camera));
 traveler.style.left=screenX+'px';
 // Depth stays on the market pavement: higher = farther away, smaller figure.
 traveler.style.bottom=(23-depth*17)+'%';
 traveler.style.height=(19+depth*8)+'%';
 redrawBoundaryOverlay(marketWidth,viewWidth);
 hud.textContent='Market '+Math.round(x*100)+'% · Depth '+Math.round(depth*100)+'%'+(wasBlocked?' · Edge of walkway':'')+(showBoundaries?' · Boundaries ON':'');
 requestAnimationFrame(moveFrame);
}
for(const side of ['left','right','forward','backward']){
 const button=document.getElementById(side);
 button.addEventListener('pointerdown',ev=>{ev.preventDefault();pressed[side]=true;button.classList.add('held');try{button.setPointerCapture(ev.pointerId)}catch(e){}});
 function release(ev){if(ev)ev.preventDefault();pressed[side]=false;button.classList.remove('held')}
 for(const event of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(event,release);
 for(const event of ['contextmenu','dragstart','selectstart'])button.addEventListener(event,e=>e.preventDefault());
}
for(const event of ['contextmenu','selectstart','dragstart'])document.getElementById('pad').addEventListener(event,e=>e.preventDefault());
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a'){pressed.left=true;e.preventDefault()}if(k==='arrowright'||k==='d'){pressed.right=true;e.preventDefault()}if(k==='arrowup'||k==='w'){pressed.forward=true;e.preventDefault()}if(k==='arrowdown'||k==='s'){pressed.backward=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a'){pressed.left=false;e.preventDefault()}if(k==='arrowright'||k==='d'){pressed.right=false;e.preventDefault()}if(k==='arrowup'||k==='w'){pressed.forward=false;e.preventDefault()}if(k==='arrowdown'||k==='s'){pressed.backward=false;e.preventDefault()}});
window.addEventListener('keydown',ev=>{if(ev.key.toLowerCase()==='b'){showBoundaries=!showBoundaries;collisionOverlay.style.display=showBoundaries?'block':'none';}});
window.addEventListener('blur',()=>{pressed.left=pressed.right=pressed.forward=pressed.backward=false});
requestAnimationFrame(moveFrame);
})();
</script></body></html>
