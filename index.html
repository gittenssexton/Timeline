<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timeline — First Walk</title><style>
*{box-sizing:border-box}body{margin:0;background:#1b1d24;color:#fff2d2;font:16px system-ui;display:flex;align-items:center;flex-direction:column;gap:9px;padding:10px 7px 24px}h1{font-size:clamp(18px,4vw,24px);margin:4px}canvas{width:min(96vw,960px);height:auto;image-rendering:pixelated;border:3px solid #8b806c;touch-action:none}.hud,.status,.panel{width:min(96vw,960px);background:#30343b;border:2px solid #b8a582;border-radius:8px;padding:10px 13px}.hud{display:flex;justify-content:space-between;font-weight:750;font-size:clamp(18px,4vw,23px)}.status{font-size:clamp(16px,3.8vw,19px);line-height:1.5;min-height:55px}.panel{font-size:18px;line-height:1.5}.panel[hidden]{display:none}.panel h2{margin:0 0 8px;font-size:21px}.controls{width:min(96vw,960px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}button{touch-action:none;background:#554d40;color:white;border:1px solid #b8a582;border-radius:8px;min-height:54px;font:700 clamp(14px,3.3vw,18px) system-ui;cursor:pointer}.controls button[data-key=use]{grid-column:span 2}button.held,button:active{background:#a58b5d;color:#17120c}.instructions{font-size:13px;text-align:center;margin:0;max-width:900px;line-height:1.4}@media(min-width:750px){.controls{grid-template-columns:repeat(7,1fr)}.controls button[data-key=use]{grid-column:auto}}@media(max-height:500px) and (orientation:landscape){body{gap:4px;padding:4px}canvas{width:min(74vw,calc((100vh - 65px)*16/9))}.hud,.status,.controls,.panel{width:min(74vw,900px)}.controls{grid-template-columns:repeat(7,1fr)}.controls button{min-height:38px}.instructions{display:none}}
</style></head><body><h1>TIMELINE — The First Walk</h1><div class="hud"><span id="date">1900 BCE</span><span>South Asia</span></div><canvas id="game" width="320" height="180" aria-label="Side scrolling historical timeline"></canvas><p class="instructions">A/D or ◀/▶: travel · X/W/↑: jump · S/Q: speak/question · E/I: inventory · ↓: inspect · M: atlas · Esc: close</p><div class="controls"><button data-key="left">◀ Past</button><button data-key="right">Future ▶</button><button data-key="up">Jump</button><button data-key="down">Inspect</button><button data-key="use">Talk / Use</button><button data-key="map">Atlas</button><button data-key="inventory">Bag</button></div><div class="status" id="status" role="status">Find the traveler and examine the abandoned mound.</div><section class="panel" id="panel" hidden><h2 id="panelTitle"></h2><div id="panelBody"></div><button data-key="escape">Close</button></section><script>
const c=document.querySelector('#game'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
let pos=18,y=0,vy=0,keys={},screen='world',knows=false,shard=false;const min=0,max=1500;
// First test uses slow historical progression, while walking speed stays unchanged.
const year=()=>Math.round(1900-pos*1580/max);
const status=t=>document.querySelector('#status').textContent=t;
function panel(){document.querySelector('#date').textContent=year()+' BCE';let p=document.querySelector('#panel');p.hidden=screen==='world';if(screen==='world')return;document.querySelector('#panelTitle').textContent=screen==='atlas'?'Historical Atlas':'Inventory & Knowledge';document.querySelector('#panelBody').textContent=screen==='atlas'?'South Asia, '+year()+' BCE. First chapter: post-Harappan settlement changes.': 'Objects: '+(shard?'Marked pottery shard':'none')+'. Knowledge: '+(knows?'Recognize certain Indus markings':'not yet learned')+'. Journal: '+(knows?'Met a traveler who remembered older settlements':'No entries yet')+'. Privileges: none.';}
function key(k,on){keys[k]=on;if(!on)return;if(k==='map'||k==='inventory'){screen=screen===k?'world':k;keys.left=false;keys.right=false;}if(k==='escape')screen='world';if(screen==='world'){if(k==='use'){if(Math.abs(pos-325)<12){screen='talk';knows=true;status('Traveler: “These old markings tell us something about the settlements before ours. Look near the mound.”')}else status('Move closer to a person to talk.');}if(k==='down'&&Math.abs(pos-180)<12){if(knows){screen='find';shard=true;status('You uncover a pottery fragment. You recognize the marking.')}else{screen='find';status('You see something in the soil, but do not recognize it yet.')}}}if(screen==='talk'||screen==='find'){setTimeout(()=>{},0)}panel();}
const bindings={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',KeyA:'left',KeyD:'right',KeyW:'up',KeyX:'up',KeyS:'use',KeyQ:'use',Numpad4:'left',Numpad6:'right',Numpad8:'up',Numpad2:'down',Numpad5:'use',KeyE:'inventory',Space:'use',Enter:'use',KeyM:'map',KeyI:'inventory',Escape:'escape'};
addEventListener('keydown',e=>{let k=bindings[e.code];if(k){e.preventDefault();if(!keys[k])key(k,true)}});addEventListener('keyup',e=>{let k=bindings[e.code];if(k)key(k,false)});
document.querySelectorAll('button').forEach(b=>{let k=b.dataset.key;const press=e=>{e.preventDefault();b.classList.add('held');key(k,true)},release=e=>{e.preventDefault();b.classList.remove('held');key(k,false)};b.addEventListener('pointerdown',press);b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('pointerleave',release);b.addEventListener('contextmenu',e=>e.preventDefault())});
addEventListener('blur',()=>{keys={}});document.addEventListener('visibilitychange',()=>{if(document.hidden)keys={}});
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function hut(x,phase){rect(x,99,45,40,phase>1?'#897667':'#b98a62');rect(x-4,96,53,6,'#7c6451');rect(x+15,118,11,21,'#483c34');if(phase>1){rect(x+6,96,8,8,'#a5c6b0');rect(x+31,108,6,12,'#6e5b50')}}
function tree(x){rect(x,94,6,47,'#765b3c');rect(x-13,80,31,23,'#688a61');rect(x-7,70,22,21,'#7a9c68')}
function draw(){g.clearRect(0,0,320,180);rect(0,0,320,180,'#bad8d0');rect(0,86,320,57,'#a2b8a0');const scroll=pos*.12;for(let i=-2;i<12;i++){const xx=((i*69-scroll*.2)%760+760)%760-50;rect(xx,79+(i%3)*4,65,36,'#91aca0')}rect(0,126,320,22,'#b9a27c');rect(0,143,320,37,'#806b51');for(let i=0;i<28;i++){let xx=((i*29-scroll*.72)%350+350)%350;rect(xx,140+(i%2)*3,6,2,'#a58b62')}
const bx=194-(pos-550)*.2;if(bx>-70&&bx<340)hut(bx,year()<900?2:year()<1500?1:0);
const tx=278-(pos-420)*.18;if(tx>-50&&tx<340)tree(tx);
const mx=160-(pos-180)*.19;if(mx>-50&&mx<340){rect(mx-13,136,42,7,'#9e8865');rect(mx,132,13,4,'#a18e6f');if(knows&&!shard){rect(mx+4,125,5,5,'#5f392a')}}
const tr=215-(pos-325)*.22;if(tr>0&&tr<320){rect(tr,117,9,17,'#694b3b');rect(tr+1,110,7,8,'#bd8b62');rect(tr-3,135,5,7,'#54392b');rect(tr+6,135,5,7,'#54392b')}
const px=150;rect(px-3,127+y,5,15,'#484a57');rect(px+4,127+y,5,15,'#484a57');rect(px-5,113+y,16,17,'#435f7b');rect(px-2,105+y,11,10,'#c89a79');rect(px-3,103+y,13,4,'#3f322d');rect(px+11,117+y,5,9,'#8b6349')}
let last=0;function frame(t){const dt=Math.min(2,(t-last)/16.67||1);last=t;if(screen==='world'){if(keys.left)pos=Math.max(min,pos-2.4*dt);if(keys.right)pos=Math.min(max,pos+2.4*dt);if(keys.up&&y===0)vy=-4.2;y+=vy*dt;vy+=.35*dt;if(y>0){y=0;vy=0}}panel();draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
